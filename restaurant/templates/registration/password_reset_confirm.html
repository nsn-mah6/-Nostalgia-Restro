{% extends 'restaurant/base.html' %}

{% block title %}Set New Password{% endblock %}

{% block content %}
  <div class="section" style="max-width: 560px; margin: 40px auto;">
    <h1>Set a New Password</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Update Password</button>
    </form>
  </div>
{% endblock %}
