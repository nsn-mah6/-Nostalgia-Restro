{% extends 'restaurant/base.html' %}

{% block title %}Reset Password{% endblock %}

{% block content %}
  <div class="section" style="max-width: 560px; margin: 40px auto;">
    <h1>Reset Your Password</h1>
    <p class="muted">Enter your email address and we will send password reset instructions.</p>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Send Reset Link</button>
    </form>
  </div>
{% endblock %}
