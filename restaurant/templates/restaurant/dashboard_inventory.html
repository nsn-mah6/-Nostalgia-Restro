{% extends 'restaurant/base.html' %}

{% block title %}Inventory Dashboard{% endblock %}

{% block content %}
  <h1>Inventory Dashboard</h1>
  <p class="muted">Monitor stock availability and ingredient replenishment.</p>
  <div class="cards">
    <div class="card"><h3>Low Stock</h3><div class="value">{{ low_stock }}</div></div>
    <div class="card"><h3>Total Items</h3><div class="value">{{ total_orders }}</div></div>
    <div class="card"><h3>Forecast</h3><div class="value">£{{ prediction.0 }}</div></div>
  </div>
{% endblock %}
